services:
  ubuntu-controller:
    image: ubuntu-mcp-server:latest
    container_name: metis-ubuntu-controller
    # Run as root only so the server can chown/chmod its own temp dirs; file
    # writes on the host-mounted /opt volume inherit the shared optusers group
    # via setgid dirs, and the umask below keeps new files group-writable
    # instead of root-only (700). Set HOST_RUN_AS to "1000:1005" (mcp:optusers)
    # to drop root entirely.
    user: "${HOST_RUN_AS:-0:0}"
    group_add:
      - "1005" # optusers — so written files are accessible to host users
    environment:
      # Default umask 007 would make files 700/600. 002 keeps them group-rw.
      - MCP_FILE_UMASK=0002
      - MCP_SHARED_GID=1005
    command: ["--policy", "dev"]
    volumes:
      - /opt:/opt
      - /tmp/metis-jobs:/tmp/metis-jobs
    networks:
      - metis-network
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: runtime
    container_name: metis-server
    ports:
      - "127.0.0.1:9999:9999"
    environment:
      - NODE_ENV=production
      - SERVER_PORT=9999
    extra_hosts:
      - "videohead.duckdns.org:host-gateway"
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      # Bind mounts for persistent data
      - ./server/mcp-registry.json:/app/mcp-registry.json
      - ./server/config.json:/app/config.json
      - ./server/generated:/app/generated
      - ~/.mcp-auth:/root/.mcp-auth
    networks:
      - metis-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    depends_on:
      ubuntu-controller:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./client/backend
      dockerfile: Dockerfile
      target: runtime
    container_name: metis-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      - PYTHON_ENV=production
      - BACKEND_PORT=8000
      - SERVER_URL=http://server:9999
    extra_hosts:
      - "videohead.duckdns.org:host-gateway"
    env_file:
      - .env
    networks:
      - metis-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    depends_on:
      server:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./client/frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    container_name: metis-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - FRONTEND_PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    env_file:
      - .env
    networks:
      - metis-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  metis-network:
    name: metis-network
    external: true

volumes:
  # Named volumes for caching (optional, using bind mounts for data)
  metis-server-node-modules:
  metis-frontend-node-modules: